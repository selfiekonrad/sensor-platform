volumes:
  data_sensor_platform:
services:
  db_sensor_platform:
    image: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: sensor-platform
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - data_sensor_platform:/var/lib/mysql
    ports:
      - "3306:3306"