apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-data-processing-service
  labels:
    app: sensor-data-processing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-data-processing-service
  template:
    metadata:
      name: sensor-data-processing-service
      labels:
        app: sensor-data-processing-service
    spec:
      containers:
        - name: sensor-data-processing-service
          image: ghcr.io/selfiekonrad/sensor-data-processing-service:0.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7676
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          env:
            - name: RABBIT_HOST
              valueFrom:
                configMapKeyRef:
                  key: rabbit_host
                  name: credentials-rabbitqm
            - name: RABBIT_PORT
              valueFrom:
                configMapKeyRef:
                  key: rabbit_port
                  name: credentials-rabbitqm
            - name: RABBIT_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: rabbit_username
                  name: credentials-rabbitqm
            - name: RABBIT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: rabbit_password
                  name: credentials-rabbitqm
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  key: db_url
                  name: credentials-db
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: db_username
                  name: credentials-db
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: db_password
                  name: credentials-db

      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sensor-data-processing-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sensor-data-processing-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
