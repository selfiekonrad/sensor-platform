apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute
spec:
  parentRefs:
    - name: gateway
  hostnames:
    - "sensor-platform.local"
  rules:
    # Write path: ingestion. The /api/sensors/data prefix is longer (and thus
    # higher precedence) than the query service's /api/sensors prefix below, so
    # POSTs to /api/sensors/data always land here.
    - matches:
        - path:
            type: PathPrefix
            value: /api/sensors/data
      backendRefs:
        - name: sensor-data-ingestion-service
          port: 80
    # Management: registration + thresholds.
    - matches:
        - path:
            type: PathPrefix
            value: /api/register
        - path:
            type: PathPrefix
            value: /api/threshold
      backendRefs:
        - name: sensor-management-service
          port: 81
    # Read path: query service. Scoped to GET so it cannot shadow the ingestion
    # POST route; covers /api/sensors/{id}/current, /history and /api/alerts.
    - matches:
        - path:
            type: PathPrefix
            value: /api/sensors
          method: GET
        - path:
            type: PathPrefix
            value: /api/alerts
          method: GET
      backendRefs:
        - name: sensor-query-service
          port: 80