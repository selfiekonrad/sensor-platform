name: Build and Push Native Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    
    strategy:
      matrix:
        service:
          - sensor-data-ingestion-service
          - sensor-data-processing-service
          - sensor-management-service
          - sensor-query-service
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filter: |
            sensor-data-ingestion-service:
              - 'sensor-data-ingestion-service/**'
              - 'common/**'
              - 'db-model/**'
              - 'pom.xml'
            sensor-data-processing-service:
              - 'sensor-data-processing-service/**'
              - 'common/**'
              - 'db-model/**'
              - 'pom.xml'
            sensor-management-service:
              - 'sensor-management-service/**'
              - 'common/**'
              - 'db-model/**'
              - 'pom.xml'
            sensor-query-service:
              - 'sensor-query-service/**'
              - 'common/**'
              - 'db-model/**'
              - 'pom.xml'

  build:
    needs: setup
    if: ${{ needs.setup.outputs.services != '[]' && needs.setup.outputs.services != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: ${{ fromJSON(needs.setup.outputs.services) }}
      fail-fast: false

    steps:
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Project Version
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -pl ${{ matrix.service }})
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install all modules
        run: |
          mvn install -DskipTests

      - name: Build Native Image for ${{ matrix.service }}
        run: |
          mvn spring-boot:build-image -pl ${{ matrix.service }} -P native -DskipTests \
             -Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ env.APP_VERSION }}

      - name: Push Image to GHCR for ${{ matrix.service }}
        run: docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ env.APP_VERSION }}