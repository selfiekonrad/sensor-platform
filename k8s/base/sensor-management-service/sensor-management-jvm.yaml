apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-management-service-jvm
  labels:
    app: sensor-management-service-jvm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-management-service-jvm
  template:
    metadata:
      name: sensor-management-service-jvm
      labels:
        app: sensor-management-service-jvm
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sensor-management-service-jvm
          image: ghcr.io/selfiekonrad/sensor-management-service:0.0.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  key: db_url
                  name: credentials-db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: db_username
                  name: credentials-db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: db_password
                  name: credentials-db
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
