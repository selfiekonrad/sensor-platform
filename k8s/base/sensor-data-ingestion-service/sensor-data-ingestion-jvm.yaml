apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-data-ingestion-service-jvm
  labels:
    app: sensor-data-ingestion-service-jvm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-data-ingestion-service-jvm
  template:
    metadata:
      name: sensor-data-ingestion-service-jvm
      labels:
        app: sensor-data-ingestion-service-jvm
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sensor-data-ingestion-service-jvm
          image: ghcr.io/selfiekonrad/sensor-data-ingestion-service:0.0.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3435
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 3435
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 3435
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 3435
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          env:
            - name: RABBIT_HOST
              valueFrom:
                secretKeyRef:
                  key: rabbit_host
                  name: credentials-rabbitqm
            - name: RABBIT_PORT
              valueFrom:
                secretKeyRef:
                  key: rabbit_port
                  name: credentials-rabbitqm
            - name: RABBIT_USERNAME
              valueFrom:
                secretKeyRef:
                  key: rabbit_username
                  name: credentials-rabbitqm
            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: rabbit_password
                  name: credentials-rabbitqm
            - name: MANAGEMENT_SERVICE_URL
              value: http://sensor-management-service:81
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
